# Pre-commit hooks — StockInsight Pro
# Install: pip install pre-commit && pre-commit install --hook-type commit-msg
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # 黄金快照（golden_*.html）必须逐字节保真，禁止被空白类钩子改写
      # —— 它们是与真实输出逐字节比对的行为基准（见 C4/C6 拆分）
      - id: trailing-whitespace
        exclude: ^stock_analyzer/tests/golden_.*\.html$
      - id: end-of-file-fixer
        exclude: ^stock_analyzer/tests/golden_.*\.html$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python: ruff (lint + format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 2026-10-17 从 v0.11.0 升到 v0.15.17：与 CI 钉定版本及本地验证口径对齐，
    # 消除「pre-commit 绿但 CI 口径不同」的漂移。当前全仓树已同时在
    # v0.11.0（历次提交钩子）与 0.15.17（本地全量 check/format）验证通过。
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Frontend: ESLint + Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^src/.*\.(ts|tsx|css)$
        types_or: [ts, tsx, css]
        additional_dependencies:
          - prettier@3.3.0

  # Conventional Commits 格式校验
  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commits
        entry: python scripts/check-commit-msg.py
        language: python
        stages: [commit-msg]
        always_run: true
