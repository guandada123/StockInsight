# StockInsight 本地 SPA + API 同源网关（本机专用，2026-10-15 新增）
#
# 用途：让手机经 Tailscale 访问 StockInsight 界面。
# 关键设计：本容器与 api 容器共享网络命名空间（network_mode: service:api），
#   因此 nginx 反代到 127.0.0.1:8765 时，API 侧看到的来源即 127.0.0.1，
#   命中 backend/main.py 的 api_auth_gate「仅允许本机」档 —— 无需配置
#   SI_API_TOKEN、无需改动任何鉴权代码，零回归风险。
#
# 对外入口：宿主机 127.0.0.1:18080（由 api 服务发布），再经 tailscale serve
#   映射为 https://192.tail6295dd.ts.net:8443/

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 运行时 API 基址注入：与页面同源（SPA 由本容器托管，/api 由本容器反代）
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 'window.__API_BASE__="";';
    }

    # API 反代（同网络命名空间 → 127.0.0.1 直连 api 容器的 8765）
    # ⚠️ 关键：**不要**注入 X-Forwarded-For！uvicorn 默认信任来自 127.0.0.1 的
    #    XFF 并据此覆盖 request.client.host，注入后 API 会把来源看作 docker 网关
    #    （实测 172.21.0.1:0）→ 鉴权闸门判非本机 → 401。去掉 XFF 后来源保持
    #    127.0.0.1，闸门放行（2026-10-15 实测验证）。
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;  # ML 分析可能耗时数十秒
    }

    # SPA 路由回退（React Router：/portfolio、/stock/600519 等）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
