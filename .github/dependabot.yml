version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "deps(py)"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "deps(npm)"
    groups:
      react:
        patterns: ["react", "react-dom"]
    ignore:
      # typescript 7.x 是大版本破坏性升级：PR#70 实测前端依赖安装失败(npm install 报错)
      # 且 npm audit 报安全项，CI 全红。暂不自动跟大版本，需人工评估后再放开。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
