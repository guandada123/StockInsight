# ============================================================
# Docker Build — 构建冒烟验证（2026-10-18 新增）
#
# 背景：Dockerfile 依赖 requirements.lock / package-lock.json / 基础镜像，
# 这些变更日常 push 不会被任何 job 验证（build.yml 仅 tag 触发），
# 2026-10-18 实测发现 Dockerfile 仍装浮动 requirements.txt（与 CI 口径
# 割裂）+ node:20 已 EOL —— 都是日常 push 发现不了的盲区。
#
# 策略：仅在影响构建的文件变更时触发（paths 过滤），buildx + gha cache
# 加速；只 build 不 push（image 由 build.yml 在 tag 时发布）。
# 本地等价命令：docker compose build --pull
#
# 2026-10-29 降本（账号级共享额度）：移除 `on.push.branches:[main]` 触发，
# push main 仅由 stockinsight-ci.yml 覆盖；本 workflow 保留 pull_request + workflow_dispatch。
# 目的：每次 push main 从 3 个 workflow 降到 1 个（与 Claw 一致）。可逆：恢复上面的 push 块即可。
# ============================================================
name: Docker Build

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "requirements.lock"
      - "requirements.txt"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: stockinsight:ci-smoke
